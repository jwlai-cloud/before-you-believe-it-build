name: Main accepts dev PRs only

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  dev-is-the-source:
    name: Main accepts dev PRs only
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the pull request source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_BRANCH" != "dev" ]; then
            echo "Pull requests into main must come from dev; received: $HEAD_BRANCH"
            exit 1
          fi
          echo "Approved event/source: $EVENT_NAME ${HEAD_BRANCH:-dev}"
